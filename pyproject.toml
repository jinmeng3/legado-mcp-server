[project]
name = "legado-mcp-server"
version = "0.2.0"
description = "MCP server that bridges Legado Web HTTP and WebSocket APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "joestar817", email = "joestar817@foxmail.com" },
]
keywords = ["legado", "mcp", "model-context-protocol", "booksource"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.28.1",
  "mcp[cli]>=1.18.0,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "websockets>=15.0.1,<16.0.0",
]

[project.urls]
Homepage = "https://github.com/joestar817/legado-mcp-server"
Repository = "https://github.com/joestar817/legado-mcp-server"
Issues = "https://github.com/joestar817/legado-mcp-server/issues"

[project.scripts]
legado-mcp-server = "legado_mcp_server.server:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.11.9,<0.12.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legado_mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"legado-web-api.md" = "legado_mcp_server/_docs/legado-web-api.md"
"mcp-tool-reference.md" = "legado_mcp_server/_docs/mcp-tool-reference.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
